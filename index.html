<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Grammar Trainer</title>
    <link rel="stylesheet" href="./styles.css?v=8" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>English Trainer For IT</h1>
      </header>

      <nav class="mode-tabs">
        <button id="tab-grammar" class="mode-tab mode-tab--active" type="button">Грамматика</button>
        <div class="vocab-tab-group" id="vocab-tab-group">
          <button id="tab-vocab" class="mode-tab vocab-tab-main" type="button">Словарь</button>
        </div>
        <button id="tab-listening" class="mode-tab" type="button">Аудирование</button>
        <button id="tab-shadowing" class="mode-tab" type="button">Shadowing</button>
        <div class="theory-tab-group" id="theory-tab-group">
          <button id="tab-theory" class="mode-tab theory-tab-main" type="button">Теория</button>
          <span id="controls-theory" class="theory-topic-control" hidden>
            <select id="theory-topic" aria-label="Тема теории"></select>
          </span>
        </div>
      </nav>

      <section id="controls-grammar" class="controls">
        <label for="level-select">Уровень</label>
        <select id="level-select"></select>
        <label for="grammar-topic">Тема</label>
        <select id="grammar-topic"></select>
        <label class="toggle-option" for="auto-speak-correct">
          <input id="auto-speak-correct" type="checkbox" checked />
          Озвучка
        </label>
        <button id="new-session" type="button">Начать заново</button>
      </section>

      <section id="controls-vocab" class="controls" hidden>
        <span class="control-pair">
          <label for="vocab-topic">Тема</label>
          <select id="vocab-topic"></select>
        </span>

        <label class="toggle-option" for="auto-speak-correct-vocab">
          <input id="auto-speak-correct-vocab" type="checkbox" checked />
          Озвучка
        </label>
        <button id="vocab-show-list" type="button">К списку слов</button>
        <button id="vocab-new-session" type="button">Начать заново</button>
      </section>

      <section id="controls-listening" class="controls listening-controls" hidden>
        <span class="control-pair">
          <label for="listening-topic">Тема</label>
          <select id="listening-topic"></select>
        </span>
        <span class="control-pair">
          <label for="listening-rate">Скорость</label>
          <select id="listening-rate">
            <option value="0.5">0.5x</option>
            <option value="0.7">0.7x</option>
            <option value="0.85" selected>0.85x</option>
            <option value="1">1x</option>
          </select>
        </span>
        <label class="toggle-option" for="listening-auto-next">
          <input id="listening-auto-next" type="checkbox" />
          Автопереход
        </label>
        <button id="listening-new-session" type="button">Начать заново</button>
      </section>

      <section id="controls-shadowing" class="controls shadowing-controls" hidden>
        <span class="control-pair">
          <label for="shadowing-topic">Тема</label>
          <select id="shadowing-topic"></select>
        </span>
        <span class="control-pair">
          <label for="shadowing-rate">Скорость</label>
          <select id="shadowing-rate">
            <option value="0.75">0.75x</option>
            <option value="0.9" selected>0.9x</option>
            <option value="1">1x</option>
          </select>
        </span>
        <span class="control-pair">
          <label for="shadowing-repetitions">Повторов</label>
          <select id="shadowing-repetitions">
            <option value="1" selected>1 раз</option>
            <option value="2">2 раза</option>
            <option value="3">3 раза</option>
          </select>
        </span>
        <button id="shadowing-new-session" type="button">Начать заново</button>
      </section>

      <section id="stats-section" class="stats">
        <div>Прогресс: <span id="position">1 / 1</span></div>
        <div>Верно: <span id="correct-count">0</span></div>
        <div>Ошибок: <span id="wrong-count">0</span></div>
      </section>

      <section class="card">
        <div id="card-content">
          <div id="question-meta" class="question-meta">Вопрос №<span id="question-id">1</span></div>
          <div id="vocab-mode-label" class="vocab-mode-label" hidden>Переведите на английский</div>
          <p id="question-text" class="question-text">Загрузка...</p>
          <p id="shadowing-inline-translation" class="shadowing-inline-translation" hidden></p>
          <div id="question-translation-row" class="question-translation-row">
            <p id="question-translation" class="question-translation"></p>
            <button id="speak-word-btn" type="button" class="speak-word-btn" disabled>
              Озвучить предложение
            </button>
          </div>

          <div class="options" id="options-section">
            <div class="options-title">Варианты</div>
            <ul>
              <li id="option-a"></li>
              <li id="option-b"></li>
              <li id="option-c"></li>
            </ul>
          </div>

          <label id="answer-label" for="answer-input">Твой ответ</label>
          <input
            id="answer-input"
            type="text"
            autocomplete="off"
            placeholder="Например: helps"
          />

          <div class="buttons">
            <button id="prev-btn" type="button">← Предыдущий</button>
            <button id="check-btn" type="button">Проверить</button>
            <button id="next-btn" type="button">Следующий →</button>
          </div>

          <div id="listening-actions" class="listening-actions" hidden>
            <button id="listen-btn" type="button">Слушать</button>
            <button id="listening-first-word" type="button">Первое слово</button>
            <button id="listening-gaps" type="button">Пропуски</button>
            <button id="listening-show-text" type="button">Весь текст</button>
          </div>

          <div id="shadowing-panel" class="shadowing-panel" hidden>
            <div class="shadowing-prompt">
              <span id="shadowing-mic" class="shadowing-mic" aria-hidden="true">🎙</span>
              <div>
                <strong id="shadowing-status">Нажмите кнопку, послушайте фразу и повторите её.</strong>
                <p id="shadowing-repetition" class="shadowing-repetition"></p>
              </div>
            </div>
            <div class="shadowing-transcript">
              <div id="shadowing-heard" class="shadowing-heard" aria-live="polite"></div>
            </div>
            <div class="shadowing-actions">
              <button id="shadowing-start" type="button">Старт</button>
              <button id="shadowing-stop" type="button">Стоп</button>
            </div>
          </div>

          <p id="feedback" class="feedback"></p>
          <p id="hint" class="hint"></p>
        </div>

        <article id="theory-panel" class="theory-panel" hidden>
          <h2 id="theory-title"></h2>
          <div id="theory-body"></div>
        </article>
      </section>
    </main>

    <div id="session-complete" class="sc-overlay" hidden>
      <div class="sc-modal">
        <button
          id="session-complete-close"
          type="button"
          class="sc-close-btn"
          aria-label="Закрыть окно результатов"
        >
          ×
        </button>
        <div class="sc-icon">🎉</div>
        <h2 class="sc-title">Тема завершена!</h2>
        <div class="sc-stats">
          <div class="sc-stat sc-stat--ok">
            <span class="sc-stat-num" id="sc-correct">0</span>
            <span class="sc-stat-label">верно</span>
          </div>
          <div class="sc-stat sc-stat--bad">
            <span class="sc-stat-num" id="sc-wrong">0</span>
            <span class="sc-stat-label">ошибок</span>
          </div>
          <div class="sc-stat">
            <span class="sc-stat-num" id="sc-pct">0%</span>
            <span class="sc-stat-label">результат</span>
          </div>
        </div>
        <button id="next-session-btn" type="button" class="sc-next-btn">
          Начать заново →
        </button>
      </div>
    </div>

    <div id="vocab-list-overlay" class="vocab-list-overlay" hidden>
      <div class="vocab-list-modal" role="dialog" aria-modal="true" aria-labelledby="vocab-list-title">
        <header class="vocab-list-header">
          <div>
            <h2 id="vocab-list-title">Список слов</h2>
            <p id="vocab-list-subtitle" class="vocab-list-subtitle"></p>
          </div>
          <button
            id="vocab-list-close"
            type="button"
            class="vocab-list-close"
            aria-label="Закрыть список слов"
          >
            ×
          </button>
        </header>
        <div id="vocab-list-body" class="vocab-list-body"></div>
      </div>
    </div>

    <script src="./questions.js"></script>
    <script src="./vocabulary.js"></script>
    <script src="./app.js?v=23"></script>
  </body>
</html>
